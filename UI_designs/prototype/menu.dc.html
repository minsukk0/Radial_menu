<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.rm button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rm button:focus{outline:none}
.rm a.sub,.rm a.add{position:absolute;display:block;text-decoration:none;cursor:pointer;outline:none}
.rm .sec,.rm .sub,.rm .add{left:0;top:0;width:760px;height:760px}
.rm .add{color:rgba(198,216,218,.55);transition:color .14s,background-color .14s}
.rm .add:hover,.rm .add:focus-visible{color:#A6F1EC;background-color:rgba(166,241,236,.07)}
.rm .lab{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap;pointer-events:none}
.rm .fan{position:absolute;left:0;top:0;width:760px;height:760px;pointer-events:none}
.rm .sec.on{color:#FFFFFF}
.rm .sel{position:absolute;left:0;top:0;width:760px;height:760px;pointer-events:none;transform-origin:380px 380px;transition:transform .22s cubic-bezier(.3,.7,.2,1),opacity .15s}
.rm .sel.off{opacity:0}
@media (prefers-reduced-motion:reduce){.rm .sel{transition:none}}
.rm .lab{text-shadow:0 1px 3px rgba(4,12,16,.6)}
.rm .lab svg{filter:drop-shadow(0 1px 2px rgba(4,12,16,.5))}
.rm .mono{width:20px;height:20px;border-radius:6px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;font-weight:600;letter-spacing:-.02em;text-shadow:none}
.rm .sec{color:#C6D8DA;transition:color .16s}
.rm .sec .lab{transition:transform .2s cubic-bezier(.3,.7,.2,1)}
.rm .sec.on .lab{transform:translate(-50%,-50%) scale(1.07)}
.rm .sub{pointer-events:auto;color:#C6D8DA;transition:color .14s}
.rm .sub::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;transition:opacity .14s;background:radial-gradient(circle at 380px 380px,color-mix(in srgb,var(--accent) 32%,transparent) 200px,color-mix(in srgb,var(--accent) 50%,transparent) 244px,color-mix(in srgb,var(--accent) 68%,transparent) 272px)}
.rm .sub:hover,.rm .sub:focus-visible,.rm .sub.demo{color:#FFFFFF;text-shadow:0 1px 2px rgba(4,22,46,.5)}
.rm .sub:hover::before,.rm .sub:focus-visible::before,.rm .sub.demo::before{opacity:1}
.rm .fan:hover .sub.demo:not(:hover){color:#C6D8DA;text-shadow:none}
.rm .fan:hover .sub.demo:not(:hover)::before{opacity:0}
.rm .sub.plus{color:rgba(198,216,218,.6)}
.rm .sub.plus::before{background:rgba(166,241,236,.09)}
.rm .sub.plus:hover,.rm .sub.plus:focus-visible{color:#A6F1EC;text-shadow:none}
.rm .pop{transform-origin:380px 380px;animation:pop-in .22s cubic-bezier(.2,.8,.2,1) both}
.rm .fan.pop{animation:none}
.rm .fan .sub{transform-origin:380px 380px;animation:sub-in .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes sub-in{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rm .pop,.rm .fan .sub{animation:none}.rm .sec .lab{transition:none}}
.rm.soft .sub:not(.plus)::before{background:radial-gradient(circle at 380px 380px,color-mix(in srgb,var(--accent) 16%,transparent) 200px,color-mix(in srgb,var(--accent) 30%,transparent) 244px,color-mix(in srgb,var(--accent) 46%,transparent) 272px)}
.rm .sel .arc{stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(44,232,255,.65))}
.rm.fade div.pop:not(.fan){background:radial-gradient(circle at 380px 380px,rgba(3,8,10,.74) 196px,rgba(3,8,10,.34) 278px) !important}
.rm.noarc path[stroke-width="4"]{display:none}
.rm [stroke="#A6F1EC"],.rm .ln{stroke-width:.6px}
.rm.nolines [stroke="#A6F1EC"],.rm.nolines .ln{display:none}
.rm > div[aria-hidden]{-webkit-backdrop-filter:blur(var(--blur,0px));backdrop-filter:blur(var(--blur,0px))}
.rm .hub{transition:color .1s,border-color .1s}
.rm .hub:hover,.rm .hub:focus-visible{color:#2CE8FF !important;border-color:#2CE8FF !important}
</style>

<script type="text/x-dc" data-dc-script data-props='{"categories":{"editor":"range","default":4,"min":1,"max":8,"step":1},"apps":{"editor":"range","default":3,"min":0,"max":10,"step":1},"accent":{"editor":"color","default":"#1E9BFF","options":["#1E9BFF","#3D7BFF","#6E56CF","#D6409F"]},"subSoft":{"editor":"boolean","default":false},"bandFade":{"editor":"boolean","default":false},"cyanArc":{"editor":"boolean","default":true},"ringLines":{"editor":"boolean","default":true},"blur":{"editor":"range","default":1,"min":0,"max":8,"step":1,"unit":"px"},"$preview":{"width":760,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hot: 0, flip: false };
    // 상위 칸은 분류이고, 하위 칸은 그 분류에 등록한 항목이다. 한 분류에는 한 종류만 담는다.
    this.cats = [
      { label: '앱', icon: 'apps', demo: 1, items: [
        { label: 'codex', mono: 'Co' }, { label: 'claude', mono: 'Cl' }, { label: 'antigravity', mono: 'An' },
        { label: '메모장', mono: '메' }, { label: '계산기', mono: '계' }, { label: '그림판', mono: '그' }, { label: '탐색기', mono: '탐' },
        { label: '브라우저', mono: '브' }, { label: '메신저', mono: '신' }, { label: '음악', mono: '음' },
      ] },
      { label: '터미널', icon: 'terminal', items: [
        { label: '새 창', icon: 'window' }, { label: '여기서 열기', icon: 'folder' }, { label: '빌드 스크립트', icon: 'play' },
      ] },
      { label: '폴더·주소', icon: 'folder', items: [
        { label: '다운로드', icon: 'folder' }, { label: '문서', icon: 'note' }, { label: '프로젝트', icon: 'folder' },
        { label: '메일', icon: 'globe' }, { label: '캘린더', icon: 'globe' },
      ] },
      { label: '시스템', icon: 'power', items: [
        { label: '잠금', icon: 'lock' }, { label: '절전', icon: 'sleep' }, { label: '설정', icon: 'settings' }, { label: '작업 관리자', icon: 'activity' },
      ] },
      // 아래 넷은 같은 종류를 이름만 달리해 여러 개 만든 예시다 (categories 값을 5 이상으로 올리면 보인다).
      { label: '앱 · 개인', icon: 'apps', items: [{ label: '음악', mono: '음' }, { label: '메신저', mono: '신' }] },
      { label: '서버', icon: 'terminal', items: [{ label: '접속', icon: 'terminal' }, { label: '로그 보기', icon: 'activity' }] },
      { label: '웹', icon: 'globe', items: [{ label: '메일', icon: 'globe' }, { label: '캘린더', icon: 'globe' }, { label: '문서', icon: 'note' }] },
      { label: '화면', icon: 'screen', items: [{ label: '밝기', icon: 'sun' }, { label: '화면 끄기', icon: 'screen' }] },
    ];
  }
  renderVals() {
    const C = 380;
    const f = (v) => String(Math.round(v * 10) / 10);
    const U = (deg) => { const a = deg * Math.PI / 180; return [Math.sin(a), -Math.cos(a)]; };
    const T = (deg) => { const a = deg * Math.PI / 180; return [Math.cos(a), Math.sin(a)]; };
    const XY = (r, deg) => { const [x, y] = U(deg); return [C + r * x, C + r * y]; };
    const P = (r, deg) => { const [x, y] = XY(r, deg); return f(x) + ' ' + f(y); };
    // 각진 부채꼴 (상위 칸, 선택 하이라이트)
    const wedge = (r0, r1, a0, a1) => 'M' + P(r0, a0) + 'L' + P(r1, a0) + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + P(r1, a1) + 'L' + P(r0, a1) + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + P(r0, a0) + 'Z';
    // 모서리가 둥근 부채꼴 (하위 메뉴 띠와 칸)
    const pad = (r0, r1, a0, a1, h, rho) => {
      const fil = (a, sgn, R, outer) => {
        const Rc = outer ? R - rho : R + rho;
        const d = h + rho;
        const s = Math.sqrt(Rc * Rc - d * d);
        const [ux, uy] = U(a);
        const [tx, ty] = T(a);
        const k = R / Rc;
        return [
          f(C + sgn * h * tx + s * ux) + ' ' + f(C + sgn * h * ty + s * uy),
          f(C + (sgn * d * tx + s * ux) * k) + ' ' + f(C + (sgn * d * ty + s * uy) * k),
        ];
      };
      const so = fil(a0, 1, r1, true);
      const eo = fil(a1, -1, r1, true);
      const si = fil(a0, 1, r0, false);
      const ei = fil(a1, -1, r0, false);
      const q = 'A' + rho + ' ' + rho + ' 0 0 1 ';
      const big = a1 - a0 > 180 ? 1 : 0;
      return 'M' + si[0] + 'L' + so[0] + q + so[1] + 'A' + r1 + ' ' + r1 + ' 0 ' + big + ' 1 ' + eo[1] + q + eo[0] + 'L' + ei[0] + q + ei[1] + 'A' + r0 + ' ' + r0 + ' 0 ' + big + ' 0 ' + si[1] + q + si[0] + 'Z';
    };

    const appCount = Math.max(0, Math.min(10, Math.round(this.props.apps ?? 3)));
    const cats = this.cats.map((c, i) => (i === 0 ? Object.assign({}, c, { items: c.items.slice(0, appCount) }) : c));

    // 상위 링: 분류 개수에 맞춰 균등 분배한다. 최소 4칸이고, 모자라는 칸은 비워 둔다.
    const count = Math.max(1, Math.min(cats.length, Math.round(this.props.categories ?? 4)));
    const n = Math.max(4, count);
    const step = 360 / n;
    const half = step / 2;
    const hot = this.state.hot < count ? this.state.hot : -1;
    if (hot >= 0) {
      const target = hot * step;
      this._rot = this._rot === undefined ? target : this._rot + (((target - this._rot) % 360 + 540) % 360 - 180);
    }

    let dividers = '';
    for (let i = 0; i < n; i++) dividers += 'M' + P(38, (i + 0.5) * step) + 'L' + P(186, (i + 0.5) * step);

    const secs = cats.slice(0, count).map((c, i) => {
      const ax = i * step;
      const [x, y] = XY(116, ax);
      return {
        cls: hot === i ? 'on' : '',
        clip: wedge(38, 186, ax - half, ax + half),
        x: f(x),
        y: f(y),
        icon: c.icon,
        label: c.label,
        pick: () => this.setState((s) => (s.hot === i ? null : { hot: i, flip: !s.flip })),
      };
    });

    // 빈칸 중 첫 칸에만 "분류 추가"를 둔다.
    const blanks = [];
    if (count < n) {
      const a = count * step;
      const [x, y] = XY(116, a);
      blanks.push({ clip: wedge(38, 186, a - half, a + half), x: f(x), y: f(y) });
    }

    // 하위 링: 항목 수 + 추가 칸 하나. 최소 4칸이고, 많아지면 띠가 넓어지다가 216도부터는 칸이 좁아진다.
    const cur = hot >= 0 ? cats[hot] : null;
    const open = !!cur;
    const fan = { band: '', lines: '', subs: [] };
    if (open) {
      const ax = hot * step;
      const items = cur.items;
      const m = Math.max(4, items.length + 1);
      const slot = Math.min(24, 216 / m);
      const span = m * slot + 4;
      const rev = ax >= 180;
      fan.band = pad(196, 278, ax - span / 2, ax + span / 2, 0, 14);
      for (let j = 1; j < m; j++) {
        const a = ax + (j - m / 2) * slot;
        fan.lines += 'M' + P(210, a) + 'L' + P(264, a);
      }
      const stagger = Math.min(0.03, 0.15 / m);
      for (let j = 0; j <= items.length; j++) {
        const ang = ax + ((rev ? m - 1 - j : j) - (m - 1) / 2) * slot;
        const [x, y] = XY(237, ang);
        const it = items[j];
        fan.subs.push({
          isItem: !!it,
          isPlus: !it,
          cls: it && cur.demo === j ? 'demo' : '',
          clip: pad(200, 274, ang - slot / 2, ang + slot / 2, 2, 10),
          x: f(x),
          y: f(y),
          delay: String(Math.round((0.05 + j * stagger) * 1000) / 1000),
          hasMono: !!(it && it.mono),
          hasIcon: !!(it && it.icon),
          mono: it ? it.mono || '' : '',
          icon: it ? it.icon || '' : '',
          label: it ? it.label : '',
        });
      }
    }

    return {
      accent: this.props.accent ?? '#1E9BFF',
      mods: (this.props.subSoft ? 'soft ' : '') + (this.props.bandFade ? 'fade ' : '') + ((this.props.cyanArc ?? true) ? '' : 'noarc ') + ((this.props.ringLines ?? true) ? '' : 'nolines'),
      blur: (this.props.blur ?? 1) + 'px',
      rot: this._rot ?? 0,
      selc: hot < 0 ? 'off' : '',
      close: () => this.setState({ hot: -1 }),
      dividers,
      selWedge: wedge(38, 218, -half, half),
      selEdge: 'M' + P(38, -half) + 'L' + P(186, -half) + 'A186 186 0 0 1 ' + P(186, half) + 'L' + P(38, half),
      selArc: 'M' + P(36, -half) + 'A36 36 0 0 1 ' + P(36, half),
      secs,
      blanks,
      fan,
      fanA: open && !this.state.flip,
      fanB: open && this.state.flip,
    };
  }
}
</script>
</body>
</html>
