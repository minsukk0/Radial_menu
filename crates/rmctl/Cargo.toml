[package]
name = "rmctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for inspecting and managing Radial Menu configuration"

[[bin]]
name = "rmctl"
path = "src/main.rs"

[dependencies]
radial-core = { path = "../radial-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
